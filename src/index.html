<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cue</title>
    <meta name="description" content="Cue — client-side media player" />
    <meta name="apple-mobile-web-app-title" content="Cue" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout-videos.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.08a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14" /><path d="M18 6.5v11L9 12l9-5.5Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 6.5v11L15 12 6 6.5Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h3.5L13 19V5L7.5 9H4Z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h3.5L13 19V5L7.5 9H4Z" fill="currentColor" stroke="none"/><path d="m16 9 5 5m0-5-5 5"/></symbol>
      <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-airplay" viewBox="0 0 24 24"><path d="M5 6h14a1 1 0 0 1 1 1v9h-4"/><path d="M3 16V7a1 1 0 0 1 1-1"/><path d="m12 14 4 6H8l4-6Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-fullscreen-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.5 5.2 5.5.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.5-.8L12 4Z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    </svg>

    <div class="app-shell">
      <main class="app-main">
        <section id="view-videos">
          <header class="top-bar" id="app-header">
            <button id="btn-menu" class="icon-btn" type="button" disabled aria-disabled="true" title="Sessions — available in M9" aria-label="Sessions">
              <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
            </button>
            <span id="session-title">Cue 1</span>
            <button id="btn-theme" class="icon-btn" type="button" aria-label="Themes">
              <svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg>
            </button>
            <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
              <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
            </button>
          </header>

          <div class="main-layout">
            <div class="video-column">
              <section id="player-container" class="show-controls no-media">
                <div id="player-media-slot"></div>
                <div id="audio-skin-mount" hidden></div>
                <div id="player-empty">
                  <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
                  <p class="player-empty-title">Nothing loaded</p>
                  <p class="player-empty-hint">Select a file or folder to start playback.</p>
                </div>
                <div id="controls-overlay">
                  <div class="transport-seek">
                    <input id="seek-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
                    <span id="time-display">0:00 / 0:00</span>
                  </div>
                  <div class="transport-buttons">
                    <button id="btn-prev" type="button" class="transport-btn" aria-label="Previous track">
                      <svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>
                    </button>
                    <button id="btn-play-pause" type="button" class="transport-btn play-btn" aria-label="Play">
                      <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
                    </button>
                    <button id="btn-next" type="button" class="transport-btn" aria-label="Next track">
                      <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
                    </button>
                    <span class="transport-spacer"></span>
                    <button id="btn-volume" type="button" class="transport-btn" aria-label="Mute">
                      <svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg>
                    </button>
                    <input id="volume-slider" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
                    <button id="btn-subtitles" type="button" class="transport-btn" disabled aria-disabled="true" title="Subtitles — available in M11">CC</button>
                    <button id="btn-pip" type="button" class="transport-btn" aria-label="Picture in picture" hidden>
                      <svg class="icon" aria-hidden="true"><use href="#i-pip"/></svg>
                    </button>
                    <button id="btn-airplay" type="button" class="transport-btn" aria-label="AirPlay">
                      <svg class="icon" aria-hidden="true"><use href="#i-airplay"/></svg>
                    </button>
                    <button id="btn-fullscreen" type="button" class="transport-btn" aria-label="Fullscreen" hidden>
                      <svg class="icon" aria-hidden="true"><use href="#i-fullscreen"/></svg>
                    </button>
                  </div>
                </div>
              </section>

              <section id="now-playing">
                <div id="track-info">
                  <span id="track-name">No file open</span>
                  <span id="track-type-badge"></span>
                </div>
                <div id="action-row">
                  <button id="btn-favorite" class="icon-btn" type="button" disabled aria-disabled="true" title="Favorites — planned" aria-label="Favorite">
                    <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
                  </button>
                  <button id="btn-info" class="icon-btn" type="button" aria-label="Track details">
                    <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
                  </button>
                </div>
              </section>
            </div>

            <aside id="playlist-sidebar">
              <header>
                <span>Up Next</span>
                <span id="playlist-count" class="queue-count"></span>
              </header>
              <ul id="playlist-items"></ul>
              <p id="playlist-empty" class="playlist-empty">Nothing queued. Add files or a folder to start.</p>
            </aside>
          </div>

          <footer id="app-footer">
            <button id="btn-select-file" class="btn btn-primary" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>
              Select file
            </button>
            <button id="btn-select-folder" class="btn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>
              Select folder
            </button>
          </footer>
        </section>
      </main>
    </div>

    <footer class="app-version">v0.8.1</footer>

    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-content">
        <header class="modal-header">
          <h2 id="settings-title">Settings</h2>
          <button id="btn-settings-close" class="icon-btn" type="button" aria-label="Close settings">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </header>
        <label class="modal-option">
          <input type="checkbox" id="pref-simulated-fs" checked>
          <span>
            Use simulated fullscreen
            <span class="option-hint">Keeps Cue's controls instead of handing off to the system player.</span>
          </span>
        </label>
      </div>
    </div>

    <div id="theme-picker" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="theme-picker-title">
      <div class="modal-content">
        <header class="modal-header">
          <h2 id="theme-picker-title">Themes</h2>
          <button id="btn-theme-close" class="icon-btn" type="button" aria-label="Close themes">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </header>
        <h3>Video themes</h3>
        <div id="video-theme-options" class="theme-options"></div>
        <h3>Audio themes</h3>
        <div id="audio-theme-options" class="theme-options"></div>
      </div>
    </div>

    <script type="module" src="/main.ts"></script>
    <script type="module" src="/diagnostics.ts"></script>
  </body>
</html>
